# Shared validation-only paper protocol for Cotton FL baselines.
# The primary model input masks expr_* at the loader boundary; source TSVs remain unchanged.
# Preserve optimizer values present in each algorithm's native YAML. Explicit
# command-line overrides still take priority; reference baselines use fallbacks.
optimizer_policy: algorithm-defaults
dataset: cotton30
client_num: 90
sample_ratio: 0.2
alpha: 0.5
seed: 1
device: cpu
partition: family
drift_pattern: false
model: MLP
num_classes: 2
rounds: 100
batch_size: 64
epochs: 6
lr: 0.01
rep_epochs: 5
clf_epochs: 1
rep_lr: 0.01
clf_lr: 0.1
eval_interval: 20
output_root: CottonExperiments/validation
deterministic: true
cotton_common_initialization: true
cotton_feature_set: no-expression
cotton_test_eval: false
cotton_cross_source_eval: false
shared_body_evaluation: latest_global

algorithm: FedAvgWeighted
cotton_root: data/cotton
