# Matched FedCCFA baseline for the Cotton paper's validation-only protocol.
algorithm: FedCCFA
dataset: cotton30
client_num: 90
sample_ratio: 0.2
seed: 1
device: cuda
partition: family
alpha: 0.5
drift_pattern: false
model: MLP
num_classes: 2
rounds: 100
eval_interval: 20
output_root: CottonExperiments/validation
cotton_feature_set: no-expression
cotton_test_eval: false
cotton_cross_source_eval: false
deterministic: true
cotton_common_initialization: true
shared_body_evaluation: latest_global
rep_epochs: 5
clf_epochs: 1
balanced_epochs: 5
momentum: 0.9
weight_decay: 0.00001
batch_size: 64
rep_lr: 0.01
clf_lr: 0.1
balanced_clf_lr: 0.1
p_lr: 0.01
lambda: 0.0
gamma: 20.0
penalize: CL
temperature: 0.1
eps: 0.1
oracle: false
weights: uniform
clustered_protos: true
